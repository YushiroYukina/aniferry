name: Windows build
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test and package
        shell: pwsh
        run: .\build.ps1 -Python python
      - name: Verify empty-profile startup
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Recurse -Filter 'AniFerry-*.exe' | Select-Object -First 1
          $taskData = Join-Path $env:RUNNER_TEMP 'aniferry-smoke'
          New-Item -ItemType Directory -Path $taskData -Force | Out-Null
          $process = Start-Process -FilePath $exe.FullName -ArgumentList @('--smoke-test', '--data-dir', ('"' + $taskData + '"')) -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0 -or !(Test-Path (Join-Path $taskData 'smoke-result.json'))) { throw 'Startup check failed' }
      - uses: actions/upload-artifact@v7
        with:
          name: AniFerry-Windows-x64
          path: dist/AniFerry-*-Windows-x64.zip
          if-no-files-found: error
          retention-days: 14
